name: Deploy Tip Split
# Retrigger after GitHub Pages was enabled (Source: GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tip-split/package-lock.json
      - name: Install
        working-directory: tip-split
        run: npm ci
      - name: Test
        working-directory: tip-split
        run: npm test
      - name: Export web
        working-directory: tip-split
        run: npx expo export --platform web
      - name: Pages files
        run: |
          touch tip-split/dist/.nojekyll
          cp tip-split/dist/index.html tip-split/dist/404.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tip-split/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
